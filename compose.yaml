services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_USER: saloon
      MARIADB_PASSWORD: saloon_dev
      MARIADB_DATABASE: saloon
      MARIADB_ROOT_PASSWORD: saloon_dev_root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
